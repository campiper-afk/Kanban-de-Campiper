<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban de Campiper</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Paleta 60-30-10
    // 60% Dominante: fondo de la página y tarjetas
    // 30% Secundario: columnas Backlog, Asignado a y En progreso
    // 10% Acento: botones, badges, bordes de tarjeta y estados interactivos
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            dominant: '#1E1E24',
            secondary: '#4A90E2',
            accent: '#FF6B35'
          }
        }
      }
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
  body { font-family: 'Poppins', sans-serif; }

  /* Fondo oscuro para Backlog, Asignado a y En progreso: se separa del fondo de la página */
  .col-dark {
    background-color: #2C313D;
    border: 1px solid rgba(74, 144, 226, 0.35);
  }
  
  /* 1. Convertimos el contenedor de cada columna en un flexbox vertical */
  #board > div { 
    display: flex; 
    flex-direction: column; 
  }
  
  /* 2. Obligamos a la zona receptora a estirarse hasta el fondo */
  .kanban-column { 
    min-height: 200px; 
    flex-grow: 1; /* Esto hace la magia de estirar la zona al máximo */
    padding-bottom: 2.5rem; /* Añade un espacio extra abajo para soltar cómodamente */
  }
  
  /* Estados de arrastre con el color de acento */
  .card-dragging { opacity: 0.5; border: 2px dashed #FF6B35; }
  .drag-over { background-color: rgba(255, 107, 53, 0.2); border-radius: 0.5rem; }

  /* Campos de formulario sobre el fondo dominante */
  .field {
    background-color: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 0.25rem;
    color: #FFFFFF;
    color-scheme: dark; /* Selector de fecha oscuro */
  }
  .field::placeholder { color: rgba(255, 255, 255, 0.5); }
  .field:focus {
    outline: none;
    border-color: #FF6B35;
    box-shadow: 0 0 0 2px rgba(255, 107, 53, 0.35);
  }
  .field option { background-color: #1E1E24; color: #FFFFFF; }
</style>
</head>
<body class="bg-dominant min-h-screen p-6">

  <header class="mb-8 flex justify-between items-center">
    <div>
      <h1 class="text-3xl font-bold text-white">Tablero Kanban - Equipo Campiper</h1>
      <p class="text-secondary">Desarrollo del curso de IA para creación web</p>
    </div>
    <button onclick="toggleModal('modal-nueva-tarea')" class="bg-accent hover:brightness-110 text-dominant font-semibold py-2 px-4 rounded shadow">
      + Nueva Tarjeta
    </button>
  </header>

  <!-- Tablero -->
  <div class="flex flex-col md:flex-row gap-4 overflow-x-auto pb-4" id="board">
    
    <!-- Columna: Backlog -->
    <div class="flex-1 min-w-[280px] col-dark rounded-lg p-4 shadow-sm" id="col-backlog">
      <h2 class="font-semibold text-white mb-4 border-b border-secondary/50 pb-2">Backlog</h2>
      <div class="kanban-column space-y-3" ondrop="drop(event, 'Backlog')" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" id="Backlog"></div>
    </div>

    <!-- Columna: Asignado a -->
    <div class="flex-1 min-w-[280px] col-dark rounded-lg p-4 shadow-sm" id="col-asignado">
      <h2 class="font-semibold text-white mb-4 border-b border-secondary/50 pb-2">Asignado a</h2>
      <div class="kanban-column space-y-3" ondrop="drop(event, 'Asignado a')" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" id="Asignado a"></div>
    </div>

    <!-- Columna: En progreso -->
    <div class="flex-1 min-w-[280px] col-dark rounded-lg p-4 shadow-sm" id="col-progreso">
      <h2 class="font-semibold text-white mb-4 border-b border-secondary/50 pb-2">En progreso</h2>
      <div class="kanban-column space-y-3" ondrop="drop(event, 'En progreso')" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" id="En progreso"></div>
    </div>

   <!-- Columna: En revisión (Adaptada a modo oscuro) -->
    <div class="flex-1 min-w-[280px] bg-yellow-900/40 rounded-lg p-4 shadow-sm border border-yellow-600/50" id="col-revision">
      <h2 class="font-semibold text-yellow-400 mb-4 border-b border-yellow-600/50 pb-2">En revisión</h2>
      <div class="kanban-column space-y-3" ondrop="drop(event, 'En revisión')" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" id="En revisión"></div>
    </div>

   <!-- Columna: Finalizado (Adaptada a modo oscuro) -->
    <div class="flex-1 min-w-[280px] bg-green-900/40 rounded-lg p-4 shadow-sm border border-green-600/50" id="col-finalizado">
      <h2 class="font-semibold text-green-400 mb-4 border-b border-green-600/50 pb-2">Finalizado</h2>
      <div class="kanban-column space-y-3" ondrop="drop(event, 'Finalizado')" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" id="Finalizado"></div>
    </div>

  </div>

  <!-- Modal para Nueva Tarjeta -->
  <div id="modal-nueva-tarea" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center">
    <div class="bg-dominant text-white border border-secondary/40 rounded-lg shadow-lg w-full max-w-md p-6">
      <h3 class="text-xl font-bold mb-4">Crear Nueva Tarea</h3>
      <form id="form-nueva-tarea" onsubmit="crearTarjeta(event)">
        <input type="text" id="titulo" placeholder="Título de la actividad" class="w-full mb-3 p-2 field" required>
        <textarea id="descripcion" placeholder="Descripción detallada" class="w-full mb-3 p-2 field" rows="3" required></textarea>
        <select id="responsable" class="w-full mb-3 p-2 field" required>
          <option value="">Asignar a...</option>
          <option value="Ignacio">Ignacio</option>
          <option value="Jean Paul">Jean Paul</option>
          <option value="Breiner">Breiner</option>
        </select>
        <div class="flex gap-2 mb-3">
          <input type="date" id="fechaInicio" class="w-1/2 p-2 field" title="Fecha de inicio" required>
          <input type="date" id="fechaFin" class="w-1/2 p-2 field" title="Fecha de finalización" required>
        </div>
        <input type="url" id="url" placeholder="URL del Entregable (Opcional)" class="w-full mb-4 p-2 field">
        
        <div class="flex justify-end gap-2">
          <button type="button" onclick="toggleModal('modal-nueva-tarea')" class="px-4 py-2 text-gray-300 hover:bg-white/10 rounded">Cancelar</button>
          <button type="submit" class="px-4 py-2 bg-accent text-dominant font-semibold rounded hover:brightness-110">Guardar Tarjeta</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal para Editar Tarjeta -->
  <div id="modal-editar-tarea" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center">
    <div class="bg-dominant text-white border border-secondary/40 rounded-lg shadow-lg w-full max-w-md p-6">
      <h3 class="text-xl font-bold mb-4">Editar Tarea</h3>
      <form id="form-editar-tarea" onsubmit="guardarEdicion(event)">
        <input type="hidden" id="edit-id">
        <input type="text" id="edit-titulo" placeholder="Título de la actividad" class="w-full mb-3 p-2 field" required>
        <textarea id="edit-descripcion" placeholder="Descripción detallada" class="w-full mb-3 p-2 field" rows="3" required></textarea>
        <select id="edit-responsable" class="w-full mb-3 p-2 field" required>
          <option value="">Asignar a...</option>
          <option value="Ignacio">Ignacio</option>
          <option value="Jean Paul">Jean Paul</option>
          <option value="Breiner">Breiner</option>
        </select>
        <div class="flex gap-2 mb-3">
          <input type="date" id="edit-fechaInicio" class="w-1/2 p-2 field" title="Fecha de inicio" required>
          <input type="date" id="edit-fechaFin" class="w-1/2 p-2 field" title="Fecha de finalización" required>
        </div>
        <input type="url" id="edit-url" placeholder="URL del Entregable (Opcional)" class="w-full mb-4 p-2 field">

        <div class="flex justify-end gap-2">
          <button type="button" onclick="toggleModal('modal-editar-tarea')" class="px-4 py-2 text-gray-300 hover:bg-white/10 rounded">Cancelar</button>
          <button type="submit" class="px-4 py-2 bg-accent text-dominant font-semibold rounded hover:brightness-110">Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // ==========================================
    // CONFIGURACIÓN: Pega aquí la URL de tu Web App
    // ==========================================
    const API_URL = 'https://script.google.com/macros/s/AKfycby5hAqCiKtcQBBGWSUKeImUCrVyxTQqRfZxkj7IUZS5EfLd1uAgFUr5xwqEHdbDx-TtLA/exec';

    // Inicializar Tablero
    document.addEventListener("DOMContentLoaded", cargarTarjetas);

    async function cargarTarjetas() {
      try {
        const response = await fetch(API_URL);
        const tarjetas = await response.json();
        renderizarTarjetas(tarjetas);
      } catch (error) {
        console.error("Error al cargar datos:", error);
      }
    }

    let tarjetasCache = [];
    let seArrastro = false;

    function renderizarTarjetas(tarjetas) {
      tarjetasCache = tarjetas;

      // Limpiar columnas
      document.querySelectorAll('.kanban-column').forEach(col => col.innerHTML = '');
      
      tarjetas.forEach(tarjeta => {
        const cardElement = document.createElement('div');
        cardElement.className = "bg-dominant p-3 rounded shadow cursor-grab active:cursor-grabbing border-l-4 border-accent hover:shadow-md transition-shadow";
        cardElement.draggable = true;
        cardElement.id = `card-${tarjeta.id}`;
        cardElement.dataset.id = tarjeta.id;
        
        cardElement.ondragstart = drag;
        cardElement.ondragend = () => {
          seArrastro = true;
          setTimeout(() => { seArrastro = false; }, 0);
        };
        cardElement.onclick = () => {
          if (!seArrastro) abrirModalEdicion(tarjeta.id)
        };
        
        let urlHTML = tarjeta.url ? `<a href="${tarjeta.url}" target="_blank" class="text-xs text-secondary hover:underline truncate block mt-2">🔗 Ver Entregable</a>` : '';

        cardElement.innerHTML = `
          <h4 class="font-bold text-white text-sm mb-1">${tarjeta.titulo}</h4>
          <p class="text-xs text-gray-300 mb-2 line-clamp-2">${tarjeta.descripcion}</p>
          <div class="flex justify-between items-center text-[10px] mb-1">
            <span class="bg-accent text-dominant font-semibold px-2 py-1 rounded">${tarjeta.responsable}</span>
          </div>
          <div class="text-[10px] text-gray-400">
            ⏳ ${tarjeta.fechaInicio} - ${tarjeta.fechaFin}
          </div>
          ${urlHTML}
        `;

        const columnaDestino = document.getElementById(tarjeta.estado);
        if (columnaDestino) columnaDestino.appendChild(cardElement);
      });
    }

    // Funciones Drag & Drop
    function drag(ev) {
      ev.dataTransfer.setData("text", ev.target.id);
      setTimeout(() => ev.target.classList.add("card-dragging"), 0);
    }

    function allowDrop(ev) {
      ev.preventDefault();
      ev.currentTarget.classList.add("drag-over");
    }

    function dragLeave(ev) {
      ev.currentTarget.classList.remove("drag-over");
    }

    async function drop(ev, nuevoEstado) {
      ev.preventDefault();
      ev.currentTarget.classList.remove("drag-over");
      
      const elementId = ev.dataTransfer.getData("text");
      const cardElement = document.getElementById(elementId);
      cardElement.classList.remove("card-dragging");
      
      // Mover visualmente primero (Optimistic UI)
      ev.currentTarget.appendChild(cardElement);
      
      const databaseId = cardElement.dataset.id;
      
      // Notificar al backend
      try {
        await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' }, // Evita preflight CORS errors
          body: JSON.stringify({
            action: 'updateStatus',
            id: databaseId,
            newStatus: nuevoEstado
          })
        });
      } catch (error) {
        console.error("Error actualizando la tarjeta:", error);
        alert("Hubo un problema de conexión al actualizar la base de datos.");
      }
    }

    // Modal y Creación
    function toggleModal(id) {
      const modal = document.getElementById(id);
      modal.classList.toggle('hidden');
    }

    async function crearTarjeta(event) {
      event.preventDefault();
      const boton = event.target.querySelector('button[type="submit"]');
      boton.disabled = true;
      boton.innerText = "Guardando...";

      const nuevaTarjeta = {
        titulo: document.getElementById('titulo').value,
        descripcion: document.getElementById('descripcion').value,
        responsable: document.getElementById('responsable').value,
        fechaInicio: document.getElementById('fechaInicio').value,
        fechaFin: document.getElementById('fechaFin').value,
        url: document.getElementById('url').value
      };

      try {
        await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            action: 'createCard',
            card: nuevaTarjeta
          })
        });
        
        // Recargar el tablero completo para asegurar sincronización
        await cargarTarjetas();
        event.target.reset();
        toggleModal('modal-nueva-tarea');
      } catch (error) {
        console.error("Error creando tarea:", error);
      } finally {
        boton.disabled = false;
        boton.innerText = "Guardar Tarjeta";
      }
    }

    // Edición de tarjetas
    function abrirModalEdicion (id) {
      const tarjeta = tarjetasCache.find(t => t.id == id);
      if (!tarjeta) return;

      document.getElementById('edit-id').value = tarjeta.id;
      document.getElementById('edit-titulo').value = tarjeta.titulo;
      document.getElementById('edit-descripcion').value = tarjeta.descripcion;
      document.getElementById('edit-responsable').value = tarjeta.responsable;
      document.getElementById('edit-fechaInicio').value = formatearFecha(tarjeta.fechaInicio);
      document.getElementById('edit-fechaFin').value = formatearFecha(tarjeta.fechaFin);
      document.getElementById('edit-url').value = tarjeta.url || '';

      toggleModal('modal-editar-tarea');
    }

    function formatearFecha(fecha) {
      if (!fecha) return '';
      const d = new Date(fecha);
      if (isNaN(d)) return fecha;
      return d.toISOString().split('T')[0];
    }

    async function guardarEdicion(event) {
      event.preventDefault();
      const boton = event.target.querySelector('button[type="submit"]');
      boton.disabled = true;
      boton.innerText = "Guardando...";

      const tarjetaEditada = {
        id: document.getElementById('edit-id').value,
        titulo: document.getElementById('edit-titulo').value,
        descripcion: document.getElementById('edit-descripcion').value,
        responsable: document.getElementById('edit-responsable').value,
        fechaInicio: document.getElementById('edit-fechaInicio').value,
        fechaFin: document.getElementById('edit-fechaFin').value,
        url: document.getElementById('edit-url').value,
      };

      try {
        await fetch(API_URL, {
          method: 'POST',
           headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({action: 'updateCard', card: tarjetaEditada })
        });
        await cargarTarjetas();
        toggleModal('modal-editar-tarea');
      } catch (error) {
        console.error("Error editando tarea:", error);
        alert("Hubo un problema al guardar los cambios.");
      } finally {
        boton.disabled = false;
        boton.innerText = "Guardar Cambios";
      }
    }

  </script>
</body>
</html>
